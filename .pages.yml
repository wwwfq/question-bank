media:
  input: public/images
  output: /images

content:
  - name: questions
    label: 题目
    type: collection
    path: src/content/questions
    filename: "{primary}.md"
    view:
      fields:
        - title
        - source
        - difficulty
        - status
        - createdAt
      primary: title
      sort:
        - createdAt
        - title
      default:
        sort: createdAt
        order: desc
    fields:
      - name: title
        label: 题目名称
        type: string
        required: true
      - name: source
        label: 题目来源
        type: select
        required: true
        options:
          multiple: true
          min: 1
          values:
            - LeetCode
            - 洛谷
            - Codeforces
            - 牛客
            - AtCoder
            - 其他
      - name: sourceId
        label: 题号
        type: string
      - name: url
        label: 原题链接
        type: string
      - name: difficulty
        label: 难度/Rating
        type: select
        required: true
        options:
          multiple: true
          min: 1
          values:
            - 入门
            - 普及-
            - 普及
            - 普及+/提高-
            - 提高
            - 提高+/省选-
            - 省选/NOI-
            - NOI/NOI+/CTS
            - *800
            - *900
            - *1000
            - *1100
            - *1200
            - *1300
            - *1400
            - *1500
            - *1600
            - *1700
            - *1800
            - *1900
            - *2000
            - *2100
            - *2200
            - *2300
            - *2400
            - *2500
            - *2600
            - *2700
            - *2800
            - *2900
            - *3000
            - *3100
            - *3200
      - name: tags
        label: 标签
        type: select
        required: true
        options:
          multiple: true
          min: 1
          values:
            - 字符串
            - 后缀自动机 SAM
            - 字典树 Trie
            - AC 自动机
            - KMP 算法
            - 动态规划 DP
            - 背包 DP
            - 数位 DP
            - 区间 DP
            - 树形 DP
            - 线性 DP
            - 状压 DP

      - name: rating
        label: 推荐程度
        type: number
        required: false
        options:
          min: 1
          max: 5
      - name: createdAt
        label: 收录日期
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: summary
        label: 核心思想
        type: text
        required: false
      - name: body
        label: 题目总结
        type: rich-text
        required: false

