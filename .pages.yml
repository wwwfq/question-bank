media:
  input: public/images
  output: /images

content:
  - name: questions
    label: 题目
    type: collection
    path: src/content/questions
    filename: "{primary}.md"
    view:
      fields:
        - title
        - source
        - difficulty
        - status
        - createdAt
      primary: title
      sort:
        - createdAt
        - title
      default:
        sort: createdAt
        order: desc
    fields:
      - name: title
        label: 题目名称
        type: string
        required: true
      - name: source
        label: 题目来源
        type: select
        required: true
        options:
          values:
            - LeetCode
            - 洛谷
            - Codeforces
            - 牛客
            - AtCoder
            - 其他
      - name: sourceId
        label: 题号
        type: string
      - name: url
        label: 原题链接
        type: string
      - name: difficulty
        label: 难度
        type: select
        required: true
        options:
          values:
            - 简单
            - 中等
            - 困难
      - name: tags
        label: 标签
        type: select
        required: true
        options:
          multiple: true
          min: 1
          values:
            - 字符串
            - 后缀自动机 SAM
            - 字典树 Trie
            - AC 自动机
            - KMP 算法
            - 动态规划 DP
            - 背包 DP
            - 数位 DP
            - 区间 DP
            - 树形 DP
            - 线性 DP
            - 状压 DP

      - name: rating
        label: 推荐程度
        type: number
        required: false
        options:
          min: 1
          max: 5
      - name: createdAt
        label: 收录日期
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: summary
        label: 核心思想
        type: text
        required: false
      - name: body
        label: 题目总结
        type: rich-text
        required: false

