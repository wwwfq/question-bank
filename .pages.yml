media:
  input: public/images
  output: /images

content:
  - name: questions
    label: 题目
    type: collection
    path: src/content/questions
    filename: "{primary}.md"
    view:
      fields:
        - title
        - source
        - difficulty
        - levels
        - createdAt
      primary: title
      sort:
        - createdAt
        - title
      default:
        sort: createdAt
        order: desc
    fields:
      - name: title
        label: 题目名称
        type: string
        required: true
      - name: source
        label: 题目来源
        type: select
        required: true
        options:
          multiple: true
          min: 1
          values:
            - LeetCode
            - 洛谷
            - 小图灵 OJ
            - Codeforces
            - 牛客
            - AtCoder
            - ICPC
            - CCPC
            - 蓝桥杯
            - GESP
            - NOIP
            - CSP-J
            - CSP-S
      
      - name: sourceId
        label: 题号
        type: string
      - name: url
        label: 原题链接
        type: string
      - name: difficulty
        label: 难度/Rating
        type: select
        required: true
        options:
          multiple: true
          min: 1
          values:
            - 入门
            - 普及-
            - 普及
            - 普及+/提高-
            - 提高
            - 提高+/省选-
            - 省选/NOI-
            - NOI/NOI+/CTS
            - "*800"
            - "*900"
            - "*1000"
            - "*1100"
            - "*1200"
            - "*1300"
            - "*1400"
            - "*1500"
            - "*1600"
            - "*1700"
            - "*1800"
            - "*1900"
            - "*2000"
            - "*2100"
            - "*2200"
            - "*2300"
            - "*2400"
            - "*2500"
            - "*2600"
            - "*2700"
            - "*2800"
            - "*2900"
            - "*3000"
            - "*3100"
            - "*3200"

      - name: levels
        label: 适用级别
        type: select
        required: false
        options:
          multiple: true
          min: 0
          values:
            - GESP 1级
            - GESP 2级
            - GESP 3级
            - GESP 4级
            - GESP 5级
            - GESP 6级
            - GESP 7级
            - GESP 8级
            - CSP-J
            - CSP-S
            - NOIP
            - 省选
            - NOI

      - name: tags
        label: 标签
        type: select
        required: true
        options:
          multiple: true
          min: 1
          values:
            - 字符串
            - 后缀自动机 SAM
            - 字典树 Trie
            - AC 自动机
            - KMP 算法
            - 动态规划 DP
            - 背包 DP
            - 数位 DP
            - 区间 DP
            - 树形 DP
            - 线性 DP
            - 状压 DP
            - 搜索
            - 广度优先搜索 BFS
            - 深度优先搜索 DFS
            - 模拟退火
            - "A* 算法"
            - 图论
            - Krukal 重构树
            - 网络流
            - 图论建模
            - 拓扑排序
            - 最短路 shortest paths
            - 最小生成树 MST
            - 负权图
            - 2-SAT
            - 强连通分量
            - Tarjan
            - 二分图
            - 最小割
            - 费用流
            - 计算几何
            - 凸包
            - 平面几何
            - 旋转卡壳
            - 极角排序
            - 线段树
            - 并查集 dsu
            - 堆
            - 树状数组
            - 树套树
            - 李超线段树
            - cdq 分治
            - 博弈论
            - SG 函数
            - 栈
            - 队列
            - 单调队列
            - 分块
            - 前缀和
            - ST 表
            - 差分
            - 数学 math
            - 数论
            - 逆元
            - Lucas 定理
            - 欧拉函数
            - 整除分块
            - 线性筛法
            - 莫比乌斯反演
            - 模拟
            - 贪心 greedy
            - 暴力 brute force
            - 递推
            - 倍增
            - 二分
            - 递归
            - 枚举
            - 分治
            - 排序 sortings
            - 斜率优化 DP
            - 四边形不等式优化 DP
            - 矩阵加速
            - 树论
            - 点分治
            - 树上启发式合并
            - 树的遍历
            - 最近公共祖先 LCA
            - 树链剖分
            - 基环树
            - 组合数学
            - 排列组合
            - 二项式定理
            - 康托展开
            - 鸽笼原理
            - 容斥原理
            - 生成函数
            - 概率论
            - 期望
            - 线性代数
            - 高斯消元
            - 线性基
            - 莫队
            - 高精度
            - 三分
            - 离散化
            - 扫描线
            - 位运算
            - 构造
            - 双指针 two-pointer
            - 启发式合并
            - 离线处理
            - 反悔贪心
            - 随机化
            - 字符串 string
      - name: createdAt
        label: 收录日期
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: statement
        label: 题意
        type: rich-text
        required: false
      - name: summary
        label: 解题思路
        type: rich-text
        required: false


